<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="canvas" style="display:none"></canvas>
<script>
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
const colors = ['#04342C', '#0A5C4A', '#0D6B58'];
let count = 0;

function generateIcon(size, colorIndex) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  
  // Background
  ctx.fillStyle = colors[colorIndex % colors.length];
  ctx.fillRect(0, 0, size, size);
  
  // Draw a leaf symbol
  ctx.fillStyle = 'white';
  ctx.font = `${Math.floor(size * 0.5)}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🌿', size/2, size/2);
  
  const link = document.createElement('a');
  link.download = `icon-${size}x${size}.png`;
  link.href = canvas.toDataURL();
  link.click();
}

for(let i = 0; i < sizes.length; i++) {
  setTimeout(() => generateIcon(sizes[i], i), i * 500);
}
</script>
<p>Generating icons... Check your downloads folder.</p>
</body>
</html>
